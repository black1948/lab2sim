<?xml version="1.0" encoding="UTF-8"?>
<!--
  chemistry.test-tube-rack-3h.v1  生成资产（source.type=local，经 renderImageAsset 渲染）
  kind: test_tube_rack   场景几何约束（构建方给定，必须遵守）:
    局部原点=底板底面中心；三个插孔中心 x=-140/0/+140（试管 0.14 归一化间距=140 舞台像素，
    试管直径约 26px → 孔外径椭圆 rx≈13、内孔 rx≈8）；架体总宽约 360-400px（本稿 370，
    立柱外缘 x=±185、立柱中心 x≈±178）；立柱高约 90-100px（本稿 96，y=-96..0）；
    横梁带孔位于 y=-84..-70（本稿横梁恰占该带，孔心 y=-77）；试管穿过横梁孔并立、管底落底板。
  视觉依据: frame-002/026/027（白色塑料试管架：底板带孔 + 两端立柱 + 顶部横梁带孔，
    三支试管并立穿过横梁孔、管底坐在底板孔位上；frame-027 特写可见底板前立面与端部立柱圆角）
  风格依据: biology.test-tube-rack.v1.renderer.js 的白塑料配色与形状语言
    （PLASTIC #efeadd / PLASTIC_TOP #f7f4ea / PLASTIC_EDGE #c6c0ae / HOLE #b9b2a0 /
    HOLE_DEEP #7d7666 + apparatus-shadow 接地阴影 rgb(45 58 62 / 18%) + 2.5D 顶面斜折 + 白色高光线），
    线宽沿用其 1.6/1.4 惯例；孔数/孔距/架宽按场景约束（不照抄该渲染器的两孔 ±50/192 宽布局）。
  坐标约定: y 向下为正；底板前立面 y=-13..0、顶面斜折面 y=-19..-13、底板孔心 y=-16。
  证据偏差: frame-002/026 的底板/横梁上隐约可见多于三孔的均布凹点（分辨率不足以定位），
    按场景约束只画三个插孔（试管占用位），多孔细节未采信，待高清证据再补。
  集成注意: renderImageAsset 现把 <image> 视口硬编码为 x-62 y-74 w124 h148，本稿 intrinsic
    400x120 会被 meet 字距收窄到 124 宽、三孔 140px 孔距被破坏——集成时须按资产 viewBox
    1:1 摆放（image.x=viewBox.minX / y=minY / width / height，详见报告）。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-200 -104 400 120" width="400" height="120">
  <!-- 接地阴影（apparatus-shadow 同色） -->
  <ellipse cx="0" cy="3" rx="196" ry="9" fill="rgb(45 58 62 / 18%)"/>

  <!-- 左右立柱（frame-002 端部平顶圆角立柱，左缘受光） -->
  <rect x="-185" y="-96" width="14" height="96" rx="4" fill="#efeadd" stroke="#c6c0ae" stroke-width="1.6"/>
  <rect x="171" y="-96" width="14" height="96" rx="4" fill="#efeadd" stroke="#c6c0ae" stroke-width="1.6"/>
  <path d="M-181 -92V-20M175 -92V-20" stroke="rgb(255 255 255 / 70%)" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M-175.5 -90V-22M180.5 -90V-22" stroke="rgb(198 192 174 / 55%)" stroke-width="1.4" stroke-linecap="round"/>

  <!-- 顶部横梁带孔（y=-84..-70，孔心 y=-77；试管从孔中穿过，场景 z 序横梁在管玻璃之后） -->
  <rect x="-178" y="-84" width="356" height="14" rx="3" fill="#f7f4ea" stroke="#c6c0ae" stroke-width="1.6"/>
  <path d="M-170 -81H170" stroke="rgb(255 255 255 / 80%)" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M-170 -71.6H170" stroke="rgb(198 192 174 / 70%)" stroke-width="1.2" stroke-linecap="round"/>
  <ellipse cx="-140" cy="-77" rx="13" ry="4.6" fill="#b9b2a0"/>
  <ellipse cx="-140" cy="-77.6" rx="8" ry="2.6" fill="#7d7666"/>
  <ellipse cx="0" cy="-77" rx="13" ry="4.6" fill="#b9b2a0"/>
  <ellipse cx="0" cy="-77.6" rx="8" ry="2.6" fill="#7d7666"/>
  <ellipse cx="140" cy="-77" rx="13" ry="4.6" fill="#b9b2a0"/>
  <ellipse cx="140" cy="-77.6" rx="8" ry="2.6" fill="#7d7666"/>

  <!-- 底板：前立面 + 2.5D 顶面斜折 + 三孔（孔心 y=-16，试管底落此面） -->
  <rect x="-185" y="-13" width="370" height="13" rx="2" fill="#efeadd" stroke="#c6c0ae" stroke-width="1.6"/>
  <path d="M-185 -13L-175 -19H175L185 -13Z" fill="#f7f4ea" stroke="#c6c0ae" stroke-width="1.6" stroke-linejoin="round"/>
  <ellipse cx="-140" cy="-16" rx="13" ry="4.6" fill="#b9b2a0"/>
  <ellipse cx="-140" cy="-16.6" rx="8" ry="2.6" fill="#7d7666"/>
  <ellipse cx="0" cy="-16" rx="13" ry="4.6" fill="#b9b2a0"/>
  <ellipse cx="0" cy="-16.6" rx="8" ry="2.6" fill="#7d7666"/>
  <ellipse cx="140" cy="-16" rx="13" ry="4.6" fill="#b9b2a0"/>
  <ellipse cx="140" cy="-16.6" rx="8" ry="2.6" fill="#7d7666"/>
  <path d="M-181 -1.6H181" stroke="rgb(183 176 158 / 70%)" stroke-width="1.2" stroke-linecap="round"/>
</svg>
